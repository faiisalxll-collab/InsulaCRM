name: Security Baseline

on:
  push:
    branches:
      - 'security-baseline'
      - 'saudi-real-estate'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tenant isolation tests
        run: php artisan test tests/Feature/Security --stop-on-failure

      - name: Run full test suite
        run: php artisan test

# security baseline revision: buyers-activities

# security baseline revision: fail-closed-tenant-scope

# security baseline revision: platform-backup-boundary

# security baseline revision: backups-roles-idor

# security baseline revision: dedupe-backup-test

# saudi real estate revision: matching-core-v1

# saudi real estate revision: matching-fixtures


  database-migrations:
    name: ${{ matrix.engine }} migration gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: MySQL 8.4
            image: mysql:8.4
            health_cmd: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - engine: MariaDB 11.4
            image: mariadb:11.4
            health_cmd: healthcheck.sh --connect --innodb_initialized

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: insula_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health_cmd }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run full migration set
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: insula_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate:fresh --force

      - name: Roll back Saudi V1 migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: insula_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate:rollback --step=5 --force

      - name: Re-apply Saudi V1 migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: insula_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      - name: Show migration status
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: insula_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate:status
